# Release: builds the .deb and the tar.gz and puts them on a draft GitHub Release.
#
# Runs when a version tag is pushed (git tag v0.0.1 && git push origin v0.0.1), or by hand
# (Actions -> release -> Run workflow): then the files only go to the run's artifacts, no release.
# The tag has to match the version in Cargo.toml. See dev.md, "release".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # the oldest Ubuntu we support: a binary built here also runs on newer ones (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: tag = version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says version $version"
            exit 1
          fi

      - name: build dependencies
        run: |
          sudo apt-get update
          # the runner image has LLVM's libunwind-14-dev, which conflicts with libunwind-dev
          # (needed by libgstreamer1.0-dev): "unmet dependencies ... held broken packages"
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: test
        run: cargo test --release

      - name: package
        run: |
          cargo install cargo-deb --locked
          cargo deb
          scripts/release-tar.sh

      - name: files of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: videoping-packages
          path: target/release-files/*

      - name: draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: videoping ${{ github.ref_name }}
          body: |
            videoping ${{ github.ref_name }} (early alpha)

            - **Ubuntu / Debian / Pop!_OS 22.04 or newer:** `sudo apt install ./videoping_*_amd64.deb`
              (pulls in GStreamer; the recommended packages add hardware decoding and recording)
            - **other distributions:** unpack the tar.gz and run `bin/videoping` (see INSTALL.txt inside)
            - check the downloads: `sha256sum -c SHA256SUMS`

            Install guide and manual: https://videoping.net
          files: target/release-files/*
