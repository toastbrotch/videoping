[package]
name = "videoping"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence", "clipboard"] }
egui = "0.37.0"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
glow = "0.17"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libloading = "0.9.1"
midir = "0.11.1"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "3", features = ["json"] }
